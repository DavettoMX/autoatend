[project]
name = "autoatend-ml"
version = "0.1.0"
description = "Offline training for AutoAtend (CENEVAL 10433). Never part of the Go binary."
requires-python = "==3.11.*"
dependencies = [
    "scikit-learn==1.9.1",
    "numpy==2.4.6",
    "scipy==1.17.1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoatend_ml"]
